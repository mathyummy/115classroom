<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>請假報備系統</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 引入 Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; }
        
        * { box-sizing: border-box !important; }
        
        /* 嚴格排除 checkbox，避免變形 */
        input:not([type="checkbox"]), select, textarea { 
            font-size: 16px !important; 
            width: 100% !important;
            max-width: 100% !important; 
        }

        /* 專門馴服 iOS 的日期輸入框 */
        input[type="date"] {
            -webkit-appearance: none;
            min-width: 0; 
            background-color: white;
            display: block;
        }

        /* 🌟 強制回復手機端原生的打勾框樣式，確保 iOS 絕對會顯示 */
        input[type="checkbox"] {
            -webkit-appearance: checkbox !important;
            appearance: checkbox !important;
            width: 1.5rem !important;
            height: 1.5rem !important;
            margin: 0 !important;
            cursor: pointer;
            display: inline-block !important;
        }
    </style>
</head>
<!-- 🌟 修正：移除 overflow-hidden，改用 items-start 確保手機版絕對可以上下順暢滑動 -->
<body class="min-h-screen py-8 px-4 flex items-start sm:items-center justify-center bg-slate-100 w-full">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-slate-200">
        <!-- 標題區域 -->
        <div class="bg-emerald-500 p-4 text-center rounded-t-2xl">
            <h1 class="text-xl font-bold text-white tracking-wider"><i class="fas fa-file-signature mr-2"></i>請假【事前報備】單</h1>
        </div>

        <div class="p-5 sm:p-6 space-y-5">
            
            <!-- 日期 -->
            <div class="w-full">
                <label class="block text-slate-700 text-base font-bold mb-2">
                    <i class="far fa-calendar-alt text-slate-400 mr-2"></i>請假日期 
                    <span class="text-emerald-600 text-sm ml-1 inline-block animate-pulse tracking-tight">👆(點擊修改)</span>
                </label>
                <input type="date" id="input-date" class="bg-white text-slate-700 px-3 py-3 rounded-lg border border-slate-300 focus:border-emerald-500 outline-none text-base shadow-sm m-0">
            </div>

            <!-- 座號與假別 -->
            <div class="grid grid-cols-2 gap-3 sm:gap-4 w-full">
                <div>
                    <label class="block text-slate-700 text-base font-bold mb-2"><i class="fas fa-user-graduate text-slate-400 mr-2"></i>學生座號</label>
                    <input type="text" id="input-seat" class="bg-slate-100 text-slate-600 px-3 py-3 rounded-lg border border-slate-200 outline-none font-bold text-lg text-center m-0" readonly placeholder="載入中...">
                </div>
                <div>
                    <label class="block text-slate-700 text-base font-bold mb-2"><i class="fas fa-tag text-slate-400 mr-2"></i>假別</label>
                    <select id="input-type" class="bg-white text-slate-700 px-3 py-3 rounded-lg border border-slate-300 focus:border-emerald-500 outline-none text-base m-0 shadow-sm">
                        <option value="病假">🤒 病假</option>
                        <option value="事假">💼 事假</option>
                        <option value="喪假">🕯️ 喪假</option>
                    </select>
                </div>
            </div>

            <!-- 時間 -->
            <div class="w-full">
                <label class="block text-slate-700 text-base font-bold mb-2"><i class="far fa-clock text-slate-400 mr-2"></i>請假節數/時間</label>
                <select id="input-duration" class="bg-white text-slate-700 px-3 py-3 rounded-lg border border-slate-300 focus:border-emerald-500 outline-none text-base m-0 shadow-sm">
                    <option value="全天">全天 (早修至放學)</option>
                    <option value="上午">上午 (早修至午休結束)</option>
                    <option value="下午">下午 (午休至放學)</option>
                    <option value="其他(於下方事由說明)">其他 (請於事由說明)</option>
                </select>
            </div>

            <!-- 事由 -->
            <div class="w-full">
                <label class="block text-slate-700 text-base font-bold mb-2"><i class="fas fa-comment-dots text-slate-400 mr-2"></i>請假事由 <span class="text-xs text-slate-500 font-normal">(若選「其他」請說明)</span></label>
                <textarea id="input-reason" rows="3" class="bg-white text-slate-700 px-3 py-3 rounded-lg border border-slate-300 focus:border-emerald-500 outline-none resize-none text-base m-0 shadow-sm" placeholder="請簡述請假原因..."></textarea>
            </div>

            <!-- 🌟 修正：分兩行顯示，並修復 iOS 隱藏打勾框的 Bug -->
            <label class="mt-4 flex flex-col bg-red-50 hover:bg-red-100 p-4 rounded-xl border border-red-200 cursor-pointer transition shadow-sm w-full">
                <div class="flex items-center">
                    <input type="checkbox" id="confirm-rule">
                    <span class="ml-3 text-red-800 font-bold text-base leading-tight">
                        <i class="fas fa-exclamation-triangle mr-1"></i>重要規定，我已詳閱並同意：
                    </span>
                </div>
                <div class="mt-2 pl-9 text-sm text-red-700 leading-relaxed">
                    本系統僅供<strong>「事前通知」</strong>。為符合學校程序，孩子返校後，<span class="bg-red-200 px-1 font-bold rounded text-red-900">仍必須補寫「紙本假卡」</span>，送交學務處才算完成手續！
                </div>
            </label>

            <!-- 送出按鈕 -->
            <button onclick="submitLeaveRequest()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl shadow-lg transition mt-5 text-lg flex justify-center items-center">
                <i class="fas fa-paper-plane mr-2"></i> 確認送出報備單
            </button>
            
            <!-- 錯誤訊息 -->
            <div id="error-msg" class="hidden bg-red-100 text-red-700 p-3 rounded-lg text-center text-sm font-bold border border-red-300 mt-3">
            </div>
        </div>
    </div>

    <!-- 成功彈出視窗 (Modal) -->
    <div id="success-modal" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center transform transition-all">
            <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-check text-3xl text-emerald-600"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">報備成功！</h2>
            <p class="text-slate-600 mb-6 font-medium">已經把請假報備送出給導師！<br>您可以關閉此視窗返回 LINE。</p>
            <button onclick="closeApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition text-lg">
                確認並返回 LINE
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAxC3eihcLYlSLuO5mb3rRt8TznxLEAidA",
            authDomain: "smart-class-system-a1645.firebaseapp.com",
            projectId: "smart-class-system-a1645",
            storageBucket: "smart-class-system-a1645.firebasestorage.app",
            messagingSenderId: "236576763126",
            appId: "1:236576763126:web:c4a50d1b21bb08089ed0d7"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const dateInput = document.getElementById('input-date');
        const today = new Date();
        const tzOffset = today.getTimezoneOffset() * 60000;
        const localISOTime = new Date(Date.now() - tzOffset).toISOString().split('T')[0];
        
        dateInput.value = localISOTime;
        dateInput.min = localISOTime;

        const urlParams = new URLSearchParams(window.location.search);
        const seatNo = urlParams.get('seat');
        if(seatNo) {
            document.getElementById('input-seat').value = String(seatNo).padStart(2, '0');
        } else {
            document.getElementById('input-seat').value = "01"; 
        }

        function submitLeaveRequest() {
            const seat = document.getElementById('input-seat').value;
            const date = document.getElementById('input-date').value;
            const type = document.getElementById('input-type').value;
            const duration = document.getElementById('input-duration').value.trim();
            const reason = document.getElementById('input-reason').value.trim();
            const confirmRule = document.getElementById('confirm-rule').checked; 
            const errorMsg = document.getElementById('error-msg');

            if(!confirmRule) {
                errorMsg.innerText = "❌ 請務必勾選「已詳閱並同意重要規定」才能送出！";
                errorMsg.classList.remove('hidden');
                return;
            }
            if(!duration || !reason) {
                errorMsg.innerText = "請假節數與事由不能為空！";
                errorMsg.classList.remove('hidden');
                return;
            }

            errorMsg.classList.add('hidden');

            db.collection("leave_requests").add({
                seatNo: seat,
                date: date,
                type: type,
                duration: duration,
                reason: reason,
                status: "pending", 
                timestamp: new Date().toISOString()
            })
            .then(() => {
                document.getElementById('success-modal').classList.remove('hidden'); 
            })
            .catch((error) => {
                errorMsg.innerText = "送出失敗，請檢查網路連線後再試。";
                errorMsg.classList.remove('hidden');
            });
        }

        function closeApp() {
            try { window.open('','_self').close(); } catch (e) {}
            
            setTimeout(() => {
                const btn = document.querySelector('#success-modal button');
                btn.innerHTML = '<i class="fas fa-times mr-2"></i>請點擊右上角「X」關閉';
                btn.classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
                btn.classList.add('bg-slate-600', 'hover:bg-slate-500');
                
                document.querySelector('#success-modal p').innerHTML = 
                    "<span class='text-red-500 font-bold'>LINE 系統限制自動關閉功能</span><br>請點擊螢幕右上角的「X」返回 LINE 聊天室。";
            }, 300);
        }
    </script>
</body>
</html>
